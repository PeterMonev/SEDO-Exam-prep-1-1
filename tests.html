
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator Tests</title>
  <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.19.4.css">
</head>
<body>
  <div id="qunit"></div>
  <div id="qunit-fixture"></div>

  <div hidden>
    <input id="a" type="number" step="any">
    <input id="b" type="number" step="any">

    <button id="btn-add">Add</button>
    <button id="btn-subtract">Subtract</button>
    <button id="btn-multiply">Multiply</button>

    <div id="result"></div>
  </div>

  <script src="https://code.jquery.com/qunit/qunit-2.19.4.js"></script>
  <script src="script.js"></script>

  <script>
    QUnit.module('Calculator functions');

    QUnit.test('add()', assert => {
      assert.strictEqual(add(2, 3), 5);
      assert.strictEqual(add(-1, 1), 0);
    });

    QUnit.test('subtract()', assert => {
      assert.strictEqual(subtract(5, 3), 2);
      assert.strictEqual(subtract(0, 4), -4);
      assert.strictEqual(subtract(10, 10), 0);
    });

    QUnit.test('multiply()', assert => {
      assert.strictEqual(multiply(5, 3), 15);
      assert.strictEqual(multiply(0, 5), 0);
      assert.strictEqual(multiply(-2, 4), -8);
    });

    QUnit.test('subtract with empty inputs', assert => {
      const a = document.getElementById('a');
      const b = document.getElementById('b');
      const result = document.getElementById('result');
      const button = document.getElementById('btn-subtract');

      a.value = '';
      b.value = '5';
      button.click();

      assert.strictEqual(
        result.textContent,
        'Please enter both numbers.',
        'First input is empty'
      );

      a.value = '10';
      b.value = '';
      button.click();

      assert.strictEqual(
        result.textContent,
        'Please enter both numbers.',
        'Second input is empty'
      );

      a.value = '';
      b.value = '';
      button.click();

      assert.strictEqual(
        result.textContent,
        'Please enter both numbers.',
        'Both inputs are empty'
      );
    });

    QUnit.test('subtract with zero values', assert => {
      const a = document.getElementById('a');
      const b = document.getElementById('b');
      const result = document.getElementById('result');
      const button = document.getElementById('btn-subtract');

      a.value = '0';
      b.value = '5';
      button.click();

      assert.strictEqual(result.textContent, '-5');

      a.value = '10';
      b.value = '0';
      button.click();

      assert.strictEqual(result.textContent, '10');

      a.value = '0';
      b.value = '0';
      button.click();

      assert.strictEqual(result.textContent, '0');
    });
  </script>
</body>
</html>
